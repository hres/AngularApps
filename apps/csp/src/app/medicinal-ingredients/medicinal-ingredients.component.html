<div>
  <div [formGroup]="medicinalIngredientForm">
     <div class="row">
        <div class="form-group col-lg-6 col-md-6 col-sm-12 col-xs-12">
            <label for="medicinalIngredents" class="required full-width">
                <span class="field-name">{{ 'medicinal.ingredients' |translate }}</span>
                <strong class="required" aria-hidden="true">{{ 'commmon.required.bracket'|translate }}</strong>
                <control-messages
                 *ngIf="medicinalIngredientForm.controls['medicinalIngredients'].invalid"
                    [showError]="showErrors"
                    [control]="medicinalIngredientForm.controls['medicinalIngredients'] | formControl"
                    controlId="medicinalIngredents"
                    label="medicinalIngrents"
                    parentId="cspMedicinalIngredients">
                </control-messages>

            <input
            class="form-control"
            id="medicinalIngredients"
            type="text"
            [formControlName]="'medicinalIngredients'"
           />
          </label>
        </div>
    </div>
  </div>
