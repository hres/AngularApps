<div>
  <div [formGroup]="patentInformationForm">
    <div class="row">
      <div class="col-sm-6">
        <label for="patentNumber" class="required">
          <span
            ><b>{{ "patent.Id" | translate }}</b></span
          >
          <strong class="required">{{
            "commmon.required.bracket" | translate
          }}</strong>
          <control-messages
            *ngIf="patentInformationForm.controls['patentNumber'].invalid"
            [showError]="showErrors"
            parentId="cspCertif"
            [control]="
              patentInformationForm.controls['patentNumber'] | formControl
            "
            controlId="patentNumber"
            label="patent.Id"
          ></control-messages>
          <input
            class="form-control"
            id="patentNumber"
            data-only-digits
            [formControlName]="'patentNumber'" maxlength="7"
          />
        </label>
      </div>
</div>

<div class="row">
      <div class="col-sm-4">
        <label for="patentFillingDate" class="required">
          <span
            ><b>{{ "filling.date" | translate }}</b></span
          >
          <strong class="required">{{
            "commmon.required.bracket" | translate
          }}</strong>
          <control-messages
            *ngIf="patentInformationForm.controls['patentFillingDate'].invalid"
            [showError]="showErrors"
            parentId="cspCertif"
            [control]="
              patentInformationForm.controls['patentFillingDate'] | formControl
            "
            controlId="patentFillingDate"
            label="filling.date"
          ></control-messages>
          <input
            class="form-control"
            id="patentFillingDate"
            type="date"
            [formControlName]="'patentFillingDate'"
            (blur)="onDateInput($event)"
          />
        </label>
      </div>

      <div class="col-sm-4">
        <label for="patentGrandDate" class="required">
          <span
            ><b>{{ "grand.date" | translate }}</b></span
          >
          <strong class="required">{{
            "commmon.required.bracket" | translate
          }}</strong>
          <control-messages
            *ngIf="patentInformationForm.controls['patentGrandDate'].invalid"
            [showError]="showErrors"
            parentId="cspCertif"
            [control]="
              patentInformationForm.controls['patentGrandDate'] | formControl
            "
            controlId="patentGrandDate"
            label="grand.date"
          ></control-messages>
          <input
            class="form-control"
            id="patentGrandDate"
            type="date"
            [formControlName]="'patentGrandDate'"
            (blur)="onDateInput($event)"
          />
        </label>
      </div>

      <div class="col-sm-4">
        <label for="patentExpirationDate" class="required">
          <span
            ><b>{{ "expiration.date" | translate }}</b></span
          >
          <strong class="required">{{
            "commmon.required.bracket" | translate
          }}</strong>
          <control-messages
            *ngIf="
              patentInformationForm.controls['patentExpirationDate'].invalid
            "
            [showError]="showErrors"
            parentId="cspCertif"
            [control]="
              patentInformationForm.controls['patentExpirationDate']
                | formControl
            "
            controlId="patentExpirationDate"
            label="expiration.date"
          ></control-messages>
          <input
            class="form-control"
            id="patentExpirationDate"
            type="date"
            [formControlName]="'patentExpirationDate'"
            (blur)="onDateInput($event)"
          />
        </label>
      </div>

    </div>
  </div>
</div>
