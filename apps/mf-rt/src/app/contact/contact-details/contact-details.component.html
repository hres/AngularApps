<div>
    <div [formGroup]="contactDetailsForm">
      <fieldset>
        <legend class="sr-only">
          {{ contactType === ADDR_CONT_TYPE.HOLDER
              ? ('heading.holder.contact' | translate)
              : ('heading.agent.contact' | translate) }}
        </legend>
       <div class="row">
        <div class="form-group col-sm-6" >
          <label for="{{contactType}}FirstName" class="required full-width">
            <span class="field-name">{{'first.name'|translate}}</span>
            <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="contactDetailsForm.controls['firstName'].invalid"
                              [showError]="showFieldErrors" [attr.aria-live]="showFieldErrors? null: 'assertive'"
                              [control]="contactDetailsForm.controls['firstName'] | formControl"
                              controlId="{{contactType}}FirstName" label="first.name" parentId="{{contactType}}Info"
                              translatedParentLabel="{{contactGroupLabelKey|translate}}"></control-messages>
          </label>
          <input name="firstName" id="{{contactType}}FirstName" class="form-control full-width" maxlength="60" required="required"
              [formControlName]="'firstName'"/>
        </div>
        <div class="form-group col-sm-6" >
          <label for="{{contactType}}LastName" class="required full-width">
            <span class="field-name">{{'last.name'|translate}}</span>
            <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="contactDetailsForm.controls['lastName'].invalid"
                              [showError]="showFieldErrors" [attr.aria-live]="showFieldErrors? null: 'assertive'"
                              [control]="contactDetailsForm.controls['lastName'] | formControl"
                              controlId="{{contactType}}LastName" label="last.name" parentId="{{contactType}}Info"
                              translatedParentLabel="{{contactGroupLabelKey|translate}}"></control-messages>
          </label>
          <input name="lastName" id="{{contactType}}LastName" class="form-control full-width" maxlength="60" required="required"
              [formControlName]="'lastName'"/>
        </div>
      </div>
      <div class="row">
        <div class="form-group col-sm-6" >
          <label for="{{contactType}}Language" class="required">
            <span class="field-name">{{'lang.correspond' |translate}}</span>
            <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="contactDetailsForm.controls['language'].invalid"
                              [showError]="showFieldErrors" [attr.aria-live]="showFieldErrors? null: 'assertive'"
                              [control]="contactDetailsForm.controls['language'] | formControl"
                              controlId="{{contactType}}Language" label="lang.correspond" parentId="{{contactType}}Info"
                              translatedParentLabel="{{contactGroupLabelKey|translate}}"></control-messages>
          </label>
          <select id="{{contactType}}Language" class="form-control" [formControlName]="'language'" required="required">
            <option label="{{ 'select.option'|translate }}" [ngValue]="null"></option>
            <option *ngFor="let langOption of languageList" [value]="langOption.id">{{langOption | textTransform: lang }}</option>
          </select>
        </div>
        <div class="form-group col-sm-6">
          <label for="{{contactType}}JobTitle" class="full-width">
            <span class="field-name">{{'job.title'|translate}}</span>
        </label>
        <input name="jobTitle" id="{{contactType}}JobTitle" class="form-control full-width" maxlength="60" [formControlName]="'jobTitle'"/>
        </div>
      </div>
      <div class="row">
        <div class="form-group col-sm-6" >
          <label for="{{contactType}}PhoneNumber" class="required full-width">
            <span class="field-name">{{'phone.number'|translate}}</span>
            <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="contactDetailsForm.controls['phoneNumber'].invalid"
                              [showError]="showFieldErrors" [attr.aria-live]="showFieldErrors? null: 'assertive'"
                              [control]="contactDetailsForm.controls['phoneNumber'] | formControl"
                              controlId="{{contactType}}PhoneNumber" label="phone.number" parentId="{{contactType}}Info"
                              translatedParentLabel="{{contactGroupLabelKey|translate}}"
                              requiredLength="10"></control-messages>
          </label>
          <input name="phoneNumber" id="{{contactType}}PhoneNumber" class="form-control full-width" data-only-digits  required="required"
              [formControlName]="'phoneNumber'" maxlength="25"/>
        </div>
        <div class="form-group col-sm-3">
          <label for="{{contactType}}PhoneExtension">
            <span class="field-name">{{'phone.extension' |translate}}</span>
          </label>
          <input name="phoneExtension" id="{{contactType}}PhoneExtension" class="form-control" maxlength="10" data-only-digits
            [formControlName]="'phoneExtension'"/>
        </div>
      </div>
      <div class="row">
        <div class="form-group col-sm-6">
          <label class="full-width" for="{{contactType}}FaxNumber">
            <span class="field-name">{{'fax.number' |translate }}</span>
              <control-messages *ngIf="contactDetailsForm.controls['faxNumber'].invalid" [showError]="showFieldErrors"
              [control]="contactDetailsForm.controls['faxNumber'] | formControl" controlId="{{contactType}}FaxNumber" label="fax.number"
              parentId="{{contactType}}Info" requiredLength="10" [attr.aria-live]="showFieldErrors? null: 'assertive'"
              translatedParentLabel="{{contactGroupLabelKey|translate}}"></control-messages>
          </label>
          <input name="faxNumber" id="{{contactType}}FaxNumber" class="form-control full-width" data-only-digits maxlength="25"
                   [formControlName]="'faxNumber'" [attr.aria-describedby]="contactType + 'nofaxNum'"/>
          <strong class="field-name small" id="{{contactType}}nofaxNum">{{'fax.number.nofaxnum' |translate }}</strong>
        </div>
      </div>
      <div class="row">
        <div class="form-group col-sm-6" >
          <label for="{{contactType}}Email" class="required full-width">
            <span class="field-name">{{'contact.email'|translate}}</span>
            <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="contactDetailsForm.controls['email'].invalid"
                              [showError]="showFieldErrors" [attr.aria-live]="showFieldErrors? null: 'assertive'"
                              [control]="contactDetailsForm.controls['email'] | formControl"
                              controlId="{{contactType}}Email" label="contact.email" parentId="{{contactType}}Info"
                              translatedParentLabel="{{contactGroupLabelKey|translate}}"></control-messages>
          </label>
          <input name="email" id="{{contactType}}Email" class="form-control full-width" maxlength="80" [formControlName]="'email'" required="required"/>
        </div>

      </div>
    </fieldset>
    </div>
  </div>
