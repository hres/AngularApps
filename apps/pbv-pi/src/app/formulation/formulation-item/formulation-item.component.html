<div [formGroup]="cRRow">
    <div id="formulationErrorSummary{{j}}">
      <lib-error-summary *ngIf="showErrorSummary()" [hiddenSummary]="showErrorSummary()"
      [errorList]="errors" headingPreamble="{{headingPreamble}}" headingPreambleParams="{{headingPreambleParams}}"
      [headingLevel]="headingLevel" label="error.msg.formulation" compId="formulationListTable{{j}}"></lib-error-summary> 
    </div>
    <div [formGroupName]="'formulation'">
        <!-- FORMULATION NAME -->
        <div class="row">
            <div class="form-group col-md-12">
              <label class="required" for="formulationName{{j}}">
                <span class="field-name">{{'formulation.name'|translate}}
                  <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
                </span>
                <control-messages *ngIf="cRRow.get('formulation.formulationName').invalid" [attr.aria-live]="showErrors? null: 'assertive'"
                  [showError]="showErrors"
                  [control]="cRRow.get('formulation.formulationName') | formControl"
                  controlId="formulationName{{j}}" label="formulation.name" parentId="formulation{{j}}"></control-messages>
                <input id="formulationName{{j}}" class="form-control full-width"
                 name="formulationName" [formControlName]="'formulationName'" maxlength="100" />
              </label>
            </div>
          </div>

        <!-- DOSAGE FORM -->
        <div class="row">
            <div class="form-group col-md-4">
              <label class="required full-width" for="dosageForm{{j}}">
                  <span class="field-name">{{'dosage.form'|translate}}
                    <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
                  </span>
                  <control-messages *ngIf="cRRow.get('formulation.dosageForm').invalid" [attr.aria-live]="showErrors? null: 'assertive'"
                  [showError]="showErrors"
                  [control]="cRRow.get('formulation.dosageForm') | formControl"
                  controlId="dosageForm{{j}}" label="formulation.dosageForm" parentId="formulation{{j}}"></control-messages>
                  <select id="dosageForm{{j}}" required [formControlName]="'dosageForm'" class="required form-control" (change)="dosageFormOnChange()">
                    <option label="{{ 'select.option'|translate }}"></option>
                    @for (dosage of dosageFormList; track dosage) {
                      <option [value]="dosage.id">{{ dosage| textTransform: lang }}</option>
                    }
                  </select>
              </label>
            </div>
        </div>

        <!-- LIST OF INGREDIENTS GO HERE -->
        <div>
          <section class="panel panel-primary mrgn-tp-lg">
            <header class="panel-heading clearfix">
              <h2 class="panel-title">{{ 'ingredients.heading' | translate}}
              </h2>
              </header>
              <div class="panel-body">
                <app-ingredient-formulation-list
                [lang]="lang" 
                [recordList]="ingredFormModelList" 
                [ingredientFormGroupRecord]="ingredientFormGroup"
                [showErrors]="showErrors"
                (errorEmit)="processIngredientListErrors($event)"></app-ingredient-formulation-list>
              </div>
          </section>
        </div>

        <!-- LIST OF ANIMAL/HUMAN SOURCED MATERIALS -->

        <!-- LIST OF CONTAINER TYPES/PACKAGE SIZE AND SHELF LIFE -->
        
        <!-- LIST OF ROUTES OF ADMINSTRATION -->

        <!-- LIST OF COUNTRIES OF MANUFACTURE FOR THIS PRODUCT -->

        <!-- LIST OF HUMAN/ANIMAL SOURCED INGREDIENT/MATERIAL -->

    </div>
    <div class="row">
      <div class="btn-group-sm col-xs-12 text-left">          
        <button id="saveIngredientRecord{{j}}" attr.aria-label="{{'save.ingredient' | translate}} {{'heading.formulation' | translate: {seqnumber: j + 1} }}" class="btn btn-primary" style="margin: 3px" (click)="saveFormulationRecord(j)" >{{'save.formulation'|translate}}</button>
        <button id="deleteIngredientRecord{{j}}" attr.aria-label="{{'delete.record' | translate}} {{ 'heading.formulation' | translate: {seqnumber: j + 1} }}" class="btn btn-danger" style="margin: 3px"  (click)="deleteFormulationRecord(j)" >{{'delete.record'|translate}}</button> <!--[disabled]="disableDeleteButton()"-->
        <button id="discardChangesIngredientRecord{{j}}" attr.aria-label="{{'discard.changes' | translate}} {{ 'heading.formulation' | translate: {seqnumber: j + 1} }}" class="btn btn-default" style="margin: 3px" [disabled]="disabledDiscardButton()" (click)="revertFormulationRecord(j, cRRow.controls['id'].value)" >{{'discard.changes'|translate}}</button>          
      </div>
    </div>
  </div>
