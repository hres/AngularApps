<div [formGroup]="contactListForm">
  <!--<lib-error-summary *ngIf="showErrorsSummary()" [hiddenSummary]="showErrorsSummary()"-->
  <!--[errorList]="errorList" headingPreamble="heading.contactInfo"-->
  <!--[headingLevel]="headingLevel" label="Company Representative Record(s)" compId="contactList"></lib-error-summary>-->

  <lib-popup [id]="popupId" [title]="'popup.warning' | translate" [message]="'msg.save.data.popup' | translate" [close]="'popup.close' | translate" (closed)="handleClosedPopupAccordion()"></lib-popup>
  <lib-confirmation-popup [id]="saveRecordPopupID" [title]="'popup.warning' | translate" [message]="'msg.discard.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="contactHeading" (confirmed)="saveContactRecord($event)" (closed)="handleClosedPopup()" ></lib-confirmation-popup>
  <!-- <lib-confirmation-popup [id]="setReviseStatusPopupID" [title]="'popup.warning' | translate" [message]="'msg.company.revise.status.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="setReviseStatusHeading" (confirmed)="statusChange($event, $event)" (closed)="handleClosedPopup()" ></lib-confirmation-popup>
   <lib-confirmation-popup [id]="setRemoveStatusPopupID" [title]="'popup.warning' | translate" [message]="'msg.company.remove.status.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="setRemoveStatusHeading" (confirmed)="statusChange($event, $event)" (closed)="handleClosedPopup()" ></lib-confirmation-popup> -->
  <lib-confirmation-popup [id]="discardRecordPopupID" [title]="'popup.warning' | translate" [message]="'msg.delete.company.record.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="discardRecordHeading" (confirmed)="deleteContact($event)" (closed)="handleClosedPopup()" ></lib-confirmation-popup>
  <lib-confirmation-popup [id]="discardChangePopupID" [title]="'popup.warning' | translate" [message]="'msg.delete.company.change.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="discardChangeHeading" (confirmed)="revertContact($event)" (closed)="handleClosedPopup()"></lib-confirmation-popup>
  <!-- <lib-confirmation-popup [id]="removeContactPopupID" [title]="'popup.warning' | translate" [message]="'msg.revise.staus.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="removeContactHeading" (confirmed)="deleteContact($event)" (closed)="handleClosedPopup()"></lib-confirmation-popup> -->
  <!-- <lib-confirmation-popup [id]="saveToDraftXMLPopupID" [title]="'popup.warning' | translate" [message]="'msg.active.and.save.company.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="saveToDraftXMLHeading" (confirmed)="statusChange($event, $event)" (closed)="handleClosedPopup()"></lib-confirmation-popup> -->
  <!-- <lib-confirmation-popup [id]="setActiveStatusPopupID" [title]="'popup.warning' | translate" [message]="'msg.active.and.save.company.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="setActiveStatusHeading" (confirmed)="statusChange($event, $event)" (closed)="handleClosedPopup()"></lib-confirmation-popup> -->

  <lib-accordion [rowsFormArray]="contactList" [accordionHeadingMsgKey]="'heading.specyDetails'" [accordionHeadingSupp]="['contactDetails', 'fullName']"
    (rowClicked)="handleRowClick($event)">

    <ng-template #tmpl let-recordRow let-idx="i">
      <!-- ==={{recordRow.get('id').value}}=== -->
      <!-- === index = {{idx}} ,  === -->
          <!-- === discardChange is revise. discardRecord is to delete record  === -->
              <!-- === index = {{idx}} ,  === -->
      <app-species-subtypes-record-comonent
         [j]="idx"
        [cRRow]="recordRow"
         [showErrors]="showErrors" [lang]="lang"
        [helpTextSequences]="helpTextSequences"
         (saveRecord)="saveContactRecord($event)"
        (errorList)="updateErrorList($event)"
        (discardChangeEvent)="discarChangeContactConfirmation($event)"
        (discardRecordEvent)="discarRecordeContactConfirmation($event)"
         [disableForm]="disableForm"
         [vetSpecies]="vetSpecies"
         [specySubTypes]="specySubTypes"
         [yesNoList]="yesNoList"
        ></app-species-subtypes-record-comonent>
    </ng-template>

  </lib-accordion>

  <div class="row mrgn-tp-md mrgn-bttm-lg">
    <div class="btn-group-sm col-md-12 text-left">
      <button class="btn btn-primary" (click)="addContact()" id="addContactBtn" [disabled]="disableAddButton()">
        {{'add.species' | translate}}
      </button>
    </div>
  </div>

</div>
