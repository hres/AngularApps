<div id="ingredientListTable" [formGroup]="recordFormGroup">
    <lib-popup [id]="popupId" [title]="'popup.title' | translate" [message]="'msg.save.ingredientFormulation.popup' | translate" [close]="'popup.close' | translate"></lib-popup>
    <lib-confirmation-popup [id]="discardPopupId" [title]="'popup.warning' | translate" [message]="'msg.discard.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="discardHeading" (confirmed)="revertRecord($event)" ></lib-confirmation-popup>
    <lib-confirmation-popup [id]="deletePopupId" [title]="'popup.warning' | translate" [message]="'msg.delete.popup'" [cancel]="'popup.cancel' | translate" [confirm]="'popup.confirm' | translate" [heading]="deleteHeading" (confirmed)="deleteRecord($event)" ></lib-confirmation-popup>  
      <div [formArrayName]="'ingredients'">
  
        <lib-accordion [rowsFormArray]="recordFormArray" [accordionHeadingMsgKey]="'heading.form.ingredient'" [accordionHeadingSupp]="['', '']" 
        (rowClicked)="handleRowClick($event)">
      
        <ng-template #tmpl let-recordRow let-idx="i">
          <!-- ==={{recordRow.get('id').value}}===
          === index = {{idx}} ,  === -->
          <app-ingredient-formulation-item
          [cRRow]="recordRow"
          [j]="idx"
          [showErrors]="showErrors"
          (saveRecord)="saveRecord($event)"
          (deleteRecord)="deleteRecordConfirmation($event)"
          (revertRecord)="discardRecordConfirmation($event)"
          (deleteHandled)="onDeleteHandled($event)"></app-ingredient-formulation-item>
        </ng-template>
      
      </lib-accordion>
    
      <div class="row mrgn-tp-md mrgn-bttm-lg">
        <div class="btn-group-sm col-md-12 text-left">
          <button class="btn btn-primary" (click)="addRecord()" id="addIngredientBtn" [disabled]="disableAddButton()"> <!--[disabled]="disableAddButton()"-->
            {{'add.ingredient'|translate}}
          </button>
        </div>
      </div>
      <div class="sr-only" id="piIngredientStatus" aria-live="polite" role="status">{{ statusMessage }}</div>
      
      <!-- <button (click)="coaddNewContact(comp.get('projects'))">Add new Project</button> -->
      <!-- <pre>{{companyContactListForm.value | json}}</pre> -->
      </div>
</div>
