<div [formGroup]="cRRow">
  <lib-popup [id]="popupId" [title]="'popup.title' | translate" [message]="'msg.discard.role.popup' | translate" [close]="'popup.close' | translate"></lib-popup>
    <div id="coContactErrorSummary{{j}}">
      <lib-error-summary *ngIf="showErrorSummary()" [hiddenSummary]="showErrorSummary()"
      [errorList]="errors" headingPreamble="{{headingPreamble}}" headingPreambleParams="{{headingPreambleParams}}"
      [headingLevel]="headingLevel" label="error.msg.companyContacts" compId="contactListTable{{j}}"></lib-error-summary>
    </div>
      <div [formGroupName]="'companyInfo'">

        <pbv-contact-details [showErrors]="showErrors"
        [lang]="lang"
        [languageList]="languageList"
        [formGroup]="contactDetailsFormGroup"
        [recordId]="j"
        (errorList)="processContactErrors($event)">
        </pbv-contact-details>

      <div class="row">
        <div class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <fieldset class="chkbxrdio-grp" id="contactCompanyRoles{{j}}">
          <legend class="required">
            <span class="field-name">{{'select.roles.rep' | translate}}</span>
            <strong class="required">{{'commmon.required.bracket'|translate}}
              <sup [id]="helpIndex['selectRolesIndx'][2] + '-2'">
                <a class="fn-lnk" [href]="'#' + helpIndex['selectRolesIndx'][1]"><span class="wb-inv">{{'instruction'|translate}}</span>{{helpIndex['selectRolesIndx'][0]}}</a>
              </sup>
            </strong>
            <control-messages *ngIf="companyRolesChkFormArray.invalid && companyRolesChkFormArray.errors?.['required'] || isNoRoleSelectedAndAllDisabled()"
                            [showError]="showErrors || isNoRoleSelectedAndAllDisabled() || rolesTouched" [attr.aria-live]="showErrors? null: 'assertive'"
                            [control]="companyRolesChkFormArray | formControl"
                            controlId="contactCompanyRoles{{j}}" label="select.roles.rep"
                            parentId="companyContact"
                            [disabledError]="isNoRoleSelectedAndAllDisabled()"></control-messages>
        </legend>
          <ul class="form-group list-unstyled">
          <li class="checkbox" [formArrayName]="'companyRoles'" *ngFor="let reason of companyRolesChkFormArray.controls; let i = index">
              <label [for]="'contactRole' + j + '-' + i">
              <input type="checkbox" [id]="'contactRole' + j + '-' + i"
              [formControl]="reason | formControl"
              (change)="companyRolesOnChange($event, representativeRolesOptionList[i].value, i)"/>
              {{representativeRolesOptionList[i].label}}
              </label>
              <!-- <div>
                <control-messages *ngIf="reason.invalid"
                [showError]="showErrors"
                [control]="reason | formControl"
                [controlId]="'contactRole' + j + '-' + i"
                [label]="representativeRolesOptionList[i].label"
                parentId="coContact">
                </control-messages>
              </div> -->
          </li>
          </ul>
        </fieldset>
        </div>
    </div>

        <div class="row">
          <div class="btn-group-sm col-xs-12 text-left">
            <button id="saveCompanyRecord{{j}}" attr.aria-label="{{'save.contact' | translate}} {{'heading.company.contact' | translate: {seqnumber: j + 1} }}" class="btn btn-primary" style="margin: 3px" (click)="saveContactRecord(j)" [disabled]="disableForm" >{{'save.contact'|translate}}</button>
            <button id="deleteCompanyRecord{{j}}" attr.aria-label="{{'delete.contact' | translate}} {{ 'heading.company.contact' | translate: {seqnumber: j + 1} }}" class="btn btn-danger" style="margin: 3px"  (click)="deleteContactRecord(j)" [disabled]="disableForm" >{{'delete.contact'|translate}}</button> <!--[disabled]="disableDeleteButton()"-->
            <button id="revertCompanyRecord{{j}}" attr.aria-label="{{'discard.changes' | translate}} {{ 'heading.company.contact' | translate: {seqnumber: j + 1} }}" class="btn btn-default" style="margin: 3px" [disabled]="disabledDiscardButton() || disableForm" (click)="revertContactRecord(j, cRRow.controls['id'].value)" >{{'discard.changes'|translate}}</button>
          </div>
        </div>
    </div>
</div>
