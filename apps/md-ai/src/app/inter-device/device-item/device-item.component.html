<div [formGroup]="cRRow">
  <div id="deviceErrorSummary{{j}}">
    <lib-error-summary *ngIf="showErrorSummary()" [hiddenSummary]="showErrorSummary()" [errorList]="errorList"
      headingPreamble="{{headingPreamble}}" headingPreambleParams="{{headingPreambleParams}}"
      [headingLevel]="headingLevel" label="error.msg.deviceDetails" compId="deviceListTable{{j}}"></lib-error-summary>
  </div>
  <div [formGroupName]="'deviceInfo'">
    <div class="row">
      <div class="form-group col-sm-12">
        <label for="deviceName{{j}}" class="required full-width">
          <span class="field-name">{{'device.name'|translate}}</span>
          <strong class="required">{{'commmon.required.bracket'|translate}}</strong>
          <control-messages *ngIf="cRRow.get('deviceInfo.deviceName').invalid" [showError]="showErrors"
            [control]="cRRow.get('deviceInfo.deviceName') | formControl" controlId="deviceName{{j}}" label="device.name"
            parentId="deviceDetails" translatedParentLabel="{{translatedParentLabel}}"></control-messages>
          <textarea id="deviceName{{j}}" name="deviceName" class="form-control full-width"
            [formControlName]="'deviceName'" maxlength="150"></textarea>
        </label>
      </div>
    </div>

    <div class="row">
      <div class="form-group col-sm-12">
        <label for="deviceAuthorized{{j}}" class="required full-width">
          <span class="field-name">{{'device.authorized' |translate}}</span>
          <strong class="required">{{'commmon.required.bracket'|translate}}</strong>
          <control-messages *ngIf="cRRow.get('deviceInfo.deviceAuthorized').invalid" [showError]="showErrors"
            [control]="cRRow.get('deviceInfo.deviceAuthorized') | formControl" controlId="deviceAuthorized{{j}}"
            label="device.authorized" parentId="deviceDetails"
            translatedParentLabel="{{translatedParentLabel}}"></control-messages>
            <div>
            <label *ngFor="let yesno of yesNoList; let i = index" for="deviceAuthorized" class="radio-inline">
              <input type="radio" id="deviceAuthorized" name="deviceAuthorized" [value]="yesno.id"
                aria-required="true" (change)="onDeviceAuthorizedChange($event)" [formControlName]="'deviceAuthorized'"/>
              {{yesno | textTransform: lang }}
            </label>
          </div>
        </label>
      </div>
      <div *ngIf="showLicenceNumber()">
        <div class="form-group col-sm-12 ">
          <label for="licenceNum{{j}}" class="required">
            <span class="field-name">{{'licence.application.number' |translate}} {{'minNumber6' |translate}}</span>
            <strong class="required">{{'commmon.required.bracket'|translate}}</strong>
            <!--<sup id="ap7-rf">-->
            <!--<a class="fn-lnk" href="#ap7"><span class="wb-inv">{{'instruction'|translate}}</span>7</a>-->
            <!--</sup>-->
            <control-messages *ngIf="cRRow.get('deviceInfo.licenceNum').invalid" [showError]="showErrors"
              [control]="cRRow.get('deviceInfo.licenceNum') | formControl" controlId="licenceNum{{j}}"
              label="licence.application.number" parentId="deviceDetails"
              translatedParentLabel="{{translatedParentLabel}}"></control-messages>
            <input id="licenceNum{{j}}" name="licenceNum" class="form-control" data-only-digits [maxLength]="6"
              [formControlName]="'licenceNum'" required />
          </label>
        </div>
      </div>
      <div *ngIf="showPreviouslySubmitted()">
        <div class="form-group col-sm-12">
          <label for="deviceApplicationSubmitted{{j}}" class="required full-width">
            <span class="field-name">{{'device.application.submitted' |translate}}</span>
            <strong class="required">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="cRRow.get('deviceInfo.deviceApplicationSubmitted').invalid" [showError]="showErrors"
              [control]="cRRow.get('deviceInfo.deviceApplicationSubmitted') | formControl"
              controlId="deviceApplicationSubmitted{{j}}" label="device.application.submitted" parentId="deviceDetails"
              translatedParentLabel="{{translatedParentLabel}}"></control-messages>
            <div>
              <label *ngFor="let yesno of yesNoList; let i = index" for="deviceApplicationSubmitted" class="radio-inline">
                <input type="radio" id="deviceApplicationSubmitted" name="deviceApplicationSubmitted" [value]="yesno.id"
                  aria-required="true" (change)="onDeviceAppChange($event)" [formControlName]="'deviceApplicationSubmitted'">
                {{yesno | textTransform: lang }}
              </label>
            </div>
          </label>
        </div>
      </div>
      <div *ngIf="showApplicationNumber()">
        <div class="form-group col-sm-12 ">
          <label for="deviceApplicationNumber{{j}}" class="required">
            <span class="field-name">{{'application.number' |translate}} {{'minNumber6' |translate}}</span>
            <strong class="required">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="cRRow.get('deviceInfo.deviceApplicationNumber').invalid" [showError]="showErrors"
              [control]="cRRow.get('deviceInfo.deviceApplicationNumber') | formControl"
              controlId="deviceApplicationNumber{{j}}" label="application.number" parentId="deviceDetails"
              translatedParentLabel="{{translatedParentLabel}}"></control-messages>
            <input id="deviceApplicationNumber{{j}}" name="deviceApplicationNumber" class="form-control" required
              data-only-digits [maxLength]="6" minlength="6" [formControlName]="'deviceApplicationNumber'" />
          </label>
        </div>
      </div>
      <div *ngIf="showPleaseExplain()">
        <div class="form-group col-sm-12">
          <label for="deviceExplain{{j}}" class="required full-width">
            <span class="field-name">{{'device.explain'|translate}}</span>
            <strong class="required">{{'commmon.required.bracket'|translate}}</strong>
            <control-messages *ngIf="cRRow.get('deviceInfo.deviceExplain').invalid" [showError]="showErrors"
              [control]="cRRow.get('deviceInfo.deviceExplain') | formControl" controlId="deviceExplain{{j}}"
              label="device.explain" parentId="deviceDetails"
              translatedParentLabel="{{translatedParentLabel}}"></control-messages>
            <textarea id="deviceExplain{{j}}" name="deviceExplain" class="form-control full-width" required
              [formControlName]="'deviceExplain'" rows="5" maxlength="1000"></textarea>
          </label>
        </div>
      </div>

      <div class="row">
        <div class="btn-group-sm col-xs-12 text-left">

          <button id="saveDeviceRecord{{j}}"
            attr.aria-label="{{'save.device' | translate}} {{'heading.interdependent.device' | translate: {seqnumber: j + 1} }}"
            class="btn btn-primary" style="margin: 3px"
            (click)="saveDeviceRecord(j)">{{'save.device'|translate}}</button>
          <button id="deleteDeviceRecord{{j}}"
            attr.aria-label="{{'delete.device' | translate}} {{'heading.interdependent.device' | translate: {seqnumber: j + 1} }}"
            class="btn btn-danger" style="margin: 3px"
            (click)="deleteDeviceRecord($event, j)">{{'delete.device'|translate}}</button>
          <button id="revertDeviceRecord{{j}}"
            attr.aria-label="{{'discard.changes' | translate}} {{'heading.interdependent.device' | translate: {seqnumber: j + 1} }}"
            class="btn btn-default" style="margin: 3px" [disabled]="disabledDiscadrButton()"
            (click)="revertDeviceRecord($event, j, cRRow.controls['id'].value)">{{'discard.changes'|translate}}</button>

        </div>
      </div>
      <!-- <pre>{{materialFormLocalModel.value |json}}</pre>-->
    </div>
  </div>
