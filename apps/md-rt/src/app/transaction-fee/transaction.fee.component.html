<div>
  <div [formGroup]="transFeeForm">
    <div class="row form-group">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
      <fieldset class="chkbxrdio-grp">
          <legend class="required">
              {{ 'are.fees' | translate}}
              <strong class="required" aria-hidden="true"> {{'commmon.required.bracket' |translate}}</strong>
              <control-messages *ngIf="transFeeForm.controls['hasFees'].invalid" [showError]="showFieldErrors"
              [control]="transFeeForm.controls['hasFees'] | formControl" controlId="hasFees" label="are.fees"
              parentId="transFees"></control-messages>
          </legend>
          <ng-container *ngFor="let yesno of yesNoList; let i = index">
              <label for="hasFeeId{{i}}" class="radio-inline">
                <input type="radio" id="hasFeeId{{i}}" name="hasFee" [value]="yesno.id" (change)="hasFeesOnChange()"
                [formControl]="transFeeForm.controls['hasFees'] | formControl" (change)="hasFeesOnChange()"
                required="required" />
                {{yesno | textTransform: lang }}
              </label>
          </ng-container>
      </fieldset>
      </div>
    </div>

    <div class="row" *ngIf="hasFeeYes">
      <div class="form-group col-lg-6 col-md-6 col-sm-12 col-xs-12">
        <label for="billCompanyId" class="required full-width">
          <span class="field-name">{{'billing.company.id'|translate}} {{ 'minNumber6'|translate }}</span>
          <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
          <control-messages *ngIf="transFeeForm.controls['billCompanyId'].invalid" [showError]="showFieldErrors"
            [control]="transFeeForm.controls['billCompanyId'] | formControl" controlId="billCompanyId"
            label="billing.company.id" parentId="transFees"></control-messages>
          <input id="billCompanyId" class="form-control" name="billCompanyId" data-only-digits [maxLength]="6"
            required="required" [formControl]="transFeeForm.controls['billCompanyId'] | formControl" />
        </label>
      </div>
      <div class="form-group col-lg-6 col-md-6 col-sm-12 col-xs-12">
        <label for="billContactId" class="required full-width">
          <span class="field-name">{{'billing.contact.id'|translate}} {{ 'minNumber5'|translate }}</span>
          <strong class="required" aria-hidden="true">{{'commmon.required.bracket'|translate}}</strong>
          <control-messages *ngIf="transFeeForm.controls['billContactId'].invalid" [showError]="showFieldErrors"
            [control]="transFeeForm.controls['billContactId'] | formControl" controlId="billContactId"
            label="billing.contact.id" parentId="transFees"></control-messages>
          <input id="billContactId" class="form-control" name="billContactId" data-only-digits [maxLength]="5"
            required="required" [formControl]="transFeeForm.controls['billContactId'] | formControl" />
        </label>
      </div>
      <div class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div role="alert" class="alert alert-info">
          <p aria-live="polite">
            {{'completed.fee.required'|translate}}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
