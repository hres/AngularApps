<section id={{id}} class="wb-overlay modal-dialog modal-content overlay-def wb-popup-mid overlay-bg">
	<header class="modal-header">
	  <h2 class="modal-title">{{title}}</h2>
	</header>
	<div class="modal-body">
	  {{message}}
	</div>
	<div class="modal-footer custom-footer">
		<button class="btn btn-default pull-right popup-modal-dismiss overlay-close close-btn" type="button" (click)="closePopup()">{{close}}</button>
	</div>
</section>
