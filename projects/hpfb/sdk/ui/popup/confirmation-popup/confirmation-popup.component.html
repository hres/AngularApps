<section id={{id}} class="wb-overlay modal-dialog modal-content overlay-def wb-popup-mid overlay-bg">
	<header class="modal-header">
	  <h2 #dialogHeading  class="modal-title"  tabindex="-1">{{title}}</h2>
	</header>
	<div  #dialogBody tabindex="0" class="modal-body">
	  {{message | translate: {heading : heading} }}
	</div>
	<div class="modal-footer custom-footer">
		<div class="left-button">
		  <button class="btn btn-default pull-right popup-modal-dismiss overlay-close close-btn" type="button" (click)="closePopup()">{{ cancel }}</button>
		</div>
		<div class="right-button">
		  <button class="btn btn-primary popup-modal-dismiss pull-left" type="button" (click)="onConfirm()">{{ confirm }}</button>
		</div>
	  </div>
</section>
