<div class="row">
  @if (!importSuccess) {
    <div class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
      <label for="fileLoad">
        <span class="field-name">{{ 'select.file'|translate }}</span>
      </label>
      <input type="file" id="fileLoad" name="fileLoad" accept=".xml, .hcsc" (change)="changeListener($event)"
        class="fileLoadBox" />
    </div>
  }
  @if (importSuccess) {
    <div class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
      <button (click)="refreshPage()">{{ 'refresh.file.input'|translate }}</button>
      <Strong> {{importedFileName}}</Strong>
    </div>
  }
</div>
@if (displayAlert) {
  <div [ngClass]="status == 'msg.success.load' ? 'alert alert-success' : 'alert alert-danger'">
    <span role="alert">{{status | translate}}</span>
  </div>
}

<ng-content select="[fileUploadInstruction]"></ng-content>
